# Build the static site on every push to main and ship it to our own server
# (replaces Vercel).
# The server installs the files as a new release and rolls back by itself if
# the site does not answer. Settings: repo variable BUILD_ENV (the NEXT_PUBLIC_*
# values, one per line) and secrets DEPLOY_SSH_KEY, DEPLOY_KNOWN_HOSTS and
# DEPLOY_TARGET (user@host; the key only runs the deploy command there).
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile --config.strict-dep-builds=false

      - name: Build
        env:
          BUILD_ENV: ${{ vars.BUILD_ENV }}
          NEXT_TELEMETRY_DISABLED: 1
        run: |
          printf '%s\n' "$BUILD_ENV" > .env.production
          pnpm run build

      - name: Package
        run: tar -czf bundle.tgz -C dist .

      - name: Ship
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_TARGET: ${{ secrets.DEPLOY_TARGET }}
        run: |
          install -m 600 /dev/null ~/deploy_key
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/known_hosts
          ssh -i ~/deploy_key -o IdentitiesOnly=yes -o UserKnownHostsFile=~/known_hosts "$DEPLOY_TARGET" < bundle.tgz
